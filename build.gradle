plugins {
    id 'java-library'
    id 'checkstyle'
    id 'pmd'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.malevolentgods.modularcraft'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'modularcraft' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = '21.1.218'
    addModdingDependenciesTo(sourceSets.gametest)
    runs {
        client {
            client(); gameDirectory = file(providers.gradleProperty('clientRunDir').getOrElse('run/client'))
            if (project.hasProperty('qa')) {
                systemProperty 'modularcraft.qa', 'true'
                systemProperty 'modularcraft.qa.load', providers.gradleProperty('qaLoad').getOrElse('false')
                systemProperty 'modularcraft.qa.ticks', providers.gradleProperty('qaTicks').getOrElse('1200')
                systemProperty 'modularcraft.qa.cycles', providers.gradleProperty('qaCycles').getOrElse('false')
                systemProperty 'modularcraft.qa.keyboard', project.hasProperty('qaKeyboard').toString()
                systemProperty 'modularcraft.qa.keybindings', project.hasProperty('qaKeybindings').toString()
                systemProperty 'modularcraft.qa.sequencer', project.hasProperty('qaSequencer').toString()
                systemProperty 'modularcraft.qa.amp', project.hasProperty('qaAmp').toString()
                systemProperty 'modularcraft.qa.mixer', project.hasProperty('qaMixer').toString()
                systemProperty 'modularcraft.qa.showcase', project.hasProperty('qaShowcase').toString()
                systemProperty 'modularcraft.qa.lfo', project.hasProperty('qaLfo').toString()
                systemProperty 'modularcraft.qa.square', project.hasProperty('qaSquare').toString()
                systemProperty 'modularcraft.qa.detune', project.hasProperty('qaDetune').toString()
                systemProperty 'modularcraft.qa.cables', project.hasProperty('qaCables').toString()
                systemProperty 'modularcraft.qa.cableRemoval', project.hasProperty('qaCableRemoval').toString()
                if (project.hasProperty('qaCables') || project.hasProperty('qaSequencer') || project.hasProperty('qaShowcase')) {
                    programArguments.addAll('--width', '1920', '--height', '1080')
                }
                programArguments.addAll('--quickPlaySingleplayer', 'ModularCraft-QA')
            }
        }
        server {
            server(); programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('serverRunDir').getOrElse('run/server'))
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('gameTestRunDir').getOrElse('run/gametest'))
            systemProperty 'modularcraft.packaged', project.hasProperty('packaged').toString()
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'modularcraft'
        }
    }
    mods {
        if (!project.hasProperty("packaged")) modularcraft { sourceSet sourceSets.main }
        modularcraft_tests { sourceSet sourceSets.gametest }
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
checkstyle { toolVersion = '10.21.2'; configFile = file('config/checkstyle/checkstyle.xml') }
pmd { toolVersion = '7.10.0'; consoleOutput = true; ruleSets = []; ruleSetFiles = files('config/pmd.xml') }
// PMD creates its runtime auxiliary configurations when its tasks are realized.
// Include them in dependency reports, lock generation, and preflight verification.
tasks.withType(org.gradle.api.plugins.quality.Pmd).each { }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-deprecation', '-Werror']
}
tasks.withType(Test).configureEach { useJUnitPlatform(); maxHeapSize = '1G' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
['processResources', 'processGametestResources'].each { taskName ->
    tasks.named(taskName) {
        inputs.property('mod_version', project.version.toString())
        filesMatching('META-INF/neoforge.mods.toml') {
            expand(mod_version: project.version.toString())
        }
    }
}
tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    manifest.attributes('Implementation-Version': project.version.toString())
}
tasks.register('runtimeArtifact') {
    dependsOn tasks.named('jar')
    def artifact = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def descriptor = layout.buildDirectory.file('runtime-artifact.json')
    inputs.file(artifact)
    inputs.property('version', project.version.toString())
    outputs.file(descriptor)
    doLast {
        descriptor.get().asFile.text = groovy.json.JsonOutput.toJson(
            [version: project.version.toString(), jar: project.relativePath(artifact.get().asFile),
             sources: project.relativePath(tasks.named('sourcesJar', Jar).get().archiveFile.get().asFile),
             project: project.relativePath(tasks.named('projectSources', Zip).get().archiveFile.get().asFile)]) + '\n'
    }
}
dependencyLocking {
    lockAllConfigurations()
    // Minecraft's native runtime dependencies differ between Linux CI and macOS development.
    if (System.getProperty('os.name').startsWith('Linux')) {
        lockFile = file('gradle/linux.lockfile')
    }
}
tasks.register('verifyDependencies') {
    group = 'verification'
    description = 'Resolve every dependency configuration, including PMD auxiliary classpaths.'
    doLast {
        configurations.findAll { it.canBeResolved }.sort { it.name }.each { configuration ->
            def files = configuration.resolve()
            logger.lifecycle("Verified ${configuration.name}: ${files.size()} files")
        }
    }
}
configurations { formatter }
dependencies { formatter 'com.google.googlejavaformat:google-java-format:1.25.2:all-deps' }
tasks.register('formatJava', JavaExec) {
    classpath = configurations.formatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    args '--replace'
    args fileTree('src').matching { include '**/*.java' }.files.sort()
}
tasks.register('formatCheck', JavaExec) {
    classpath = configurations.formatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    args '--dry-run', '--set-exit-if-changed'
    args fileTree('src').matching { include '**/*.java' }.files.sort()
}
tasks.named('check') { dependsOn 'formatCheck' }
['formatJava', 'formatCheck'].each { taskName ->
    tasks.named(taskName, JavaExec) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        jvmArgs(['api', 'file', 'parser', 'tree', 'util', 'code'].collect {
            "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
        })
    }
}
tasks.named('formatCheck') { mustRunAfter 'formatJava' }
tasks.named('sourcesJar') {
    from('art') { into 'art' }
    from('scripts/generate-assets.py') { into 'scripts' }
    from('docs') { into 'docs' }
    from('README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('validation') { include '*.md', '*.json', 'amp/*.md', 'amp/*.json', 'amp/*.xml', 'amp/*.txt', 'showcase/**', 'midi/**', 'detune/**', 'sequencer/**', 'square/**', 'mixer/**', 'lfo/*.md', 'lfo/*.json', 'lfo/*.xml', 'lfo/*.txt', 'lfo/*.png'; into 'validation' }
}
tasks.register('projectSources', Zip) {
    archiveBaseName = 'modularcraft'
    archiveClassifier = 'project'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('.') {
        include 'src/**', 'art/**', 'config/**', 'docs/**', 'scripts/**', 'gradle/**',
            '.github/**', 'specs/**', '.specify/memory/constitution.md',
            'validation/*.md', 'validation/*.json', 'validation/*.xml', 'validation/amp/*.md', 'validation/amp/*.json', 'validation/amp/*.xml', 'validation/amp/*.txt', 'validation/showcase/**', 'validation/midi/**', 'validation/detune/**', 'validation/sequencer/**', 'validation/square/**', 'validation/mixer/**', 'validation/lfo/*.md', 'validation/lfo/*.json', 'validation/lfo/*.xml', 'validation/lfo/*.txt', 'validation/lfo/*.png',
            'Makefile', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle.lockfile',
            'gradlew', 'gradlew.bat', '.gitignore', '.cz.toml', 'AGENTS.md', 'README.md',
            'CHANGELOG.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md'
        exclude '**/__pycache__/**', '**/.DS_Store'
    }
}
tasks.named('assemble') { dependsOn 'projectSources', 'runtimeArtifact' }
tasks.register('dependencyInventory') {
    doLast {
        def entries = []
        configurations.findAll { it.canBeResolved && !it.name.startsWith('neoForm') }.each { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                entries << [configuration: configuration.name, group: id.group, name: id.name, version: id.version,
                    file: artifact.file.name, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }
        }
        file('validation/dependencies.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries.unique().sort { "${it.group}:${it.name}:${it.version}:${it.configuration}" })) + '\n'
    }
}
